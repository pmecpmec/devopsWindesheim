# Infrastructuurtests voor de container. Draaien in de HEALTHCHECK en in de pipeline (docker exec).
port:
  tcp:8080:
    listening: true
process:
  nginx:
    running: true
file:
  /usr/share/nginx/html/main.dart.js:
    exists: true
http:
  http://localhost:8080/health:
    status: 200
    body: ["OK"]
  http://localhost:8080/:
    status: 200
    body: ["<title>Teamplanner</title>"]

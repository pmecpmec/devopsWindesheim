server {
    listen 8080;
    root /usr/share/nginx/html;

    # Healthcheck voor Goss en de hostingpartij
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "OK";
    }

    # Flutter is een single-page app: onbekende paden gaan naar index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
